<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Security tuned for GitHub Pages + raw image previews + local products.json -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'self';
    frame-ancestors 'none';
    img-src 'self' data: https://raw.githubusercontent.com https://i.postimg.cc https://images.unsplash.com;
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    connect-src 'self';
    form-action https://wa.me;
    upgrade-insecure-requests">
  <meta http-equiv="Referrer-Policy" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0ea5e9" />
  <title>Flair Car Accessories</title>
  <meta name="description" content="Flair Car Accessories: Quality car accessories. Order quickly via WhatsApp." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --brand:#0ea5e9; --brand-d:#0284c7; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
      --bg:#f8fafc; --wa:#25D366; --card:#fff; --ok:#16a34a; --rose:#fb7185;
      --chip:#0f172a0d; --chip-b:#cbd5e1;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
    a{color:inherit}

    header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:1000;backdrop-filter:saturate(180%) blur(8px)}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:12px 18px}
    .brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px}
    .brand .logo{width:36px;height:36px;background:var(--brand);display:grid;place-items:center;color:#fff;border-radius:8px}
    .nav-actions{display:flex;gap:10px;align-items:center}
    .button{padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:600;border:1px solid var(--line);cursor:pointer;background:#fff;color:var(--ink)}
    .primary{background:var(--brand);color:#fff;border-color:var(--brand)}
    .primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
    .iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}

    .hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;padding:20px}
    .hero img{border-radius:12px;width:100%;height:100%;object-fit:cover}

    /* Free delivery bar */
    .bar{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .bar .wrap{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center}
    .progress{flex:1;height:8px;background:#eef2f7;border-radius:999px;overflow:hidden}
    .progress>span{display:block;height:100%;background:var(--ok);width:0%}

    .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px}
    .controls .search{flex:1;min-width:240px;display:flex;gap:8px}
    .controls input[type="search"]{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
    .controls select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{background:var(--chip);border:1px solid var(--chip-b);padding:6px 10px;border-radius:999px;cursor:pointer}
    .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding:16px}
    .empty{padding:24px;border:1px dashed var(--line);border-radius:12px;text-align:center;background:#fff;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;transition:transform .2s}
    .card:hover{transform:translateY(-3px)}
    .card .body{padding:12px}
    .price{font-weight:800;margin:6px 0}
    .qty{margin:8px 0}
    .moq{display:inline-block;font-size:11px;background:#d1fae5;color:#065f46;border:1px solid #a7f3d0;border-radius:999px;padding:2px 8px;margin-left:6px}
    .wish{position:absolute;top:8px;right:8px}

    .slider{position:relative;width:100%;background:#f1f5f9;aspect-ratio:4/3;overflow:hidden}
    .slide{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;display:flex}
    .slide.active{opacity:1}
    .slide img{width:100%;height:100%;object-fit:cover;display:block;background:#eef2f7}
    .dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:6px;z-index:2;pointer-events:none}
    .dot{width:7px;height:7px;border-radius:50%;background:rgba(15,23,42,.35);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset}
    .dot.active{background:#fff}
    .navBtn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);display:grid;place-items:center;cursor:pointer;z-index:2;box-shadow:0 4px 10px rgba(2,6,23,.12)}
    .navBtn svg{width:18px;height:18px}
    .navPrev{left:8px}.navNext{right:8px}
    @media (hover:none){ .navBtn{display:none} }

    footer{margin-top:20px;border-top:1px solid var(--line);padding:20px;background:#fff}
    .muted{color:var(--muted);font-size:12px}
    h1{font-size:clamp(22px,4.5vw,34px);line-height:1.15}
    h3{font-size:clamp(14px,2.8vw,18px);line-height:1.25}
    .muted{font-size:clamp(12px,2.8vw,14px)}
    input,select,textarea,button{font-size:16px}
    img{max-width:100%;height:auto}
    .slide img{background-color:#eef2f7}

    /* Drawer (cart) */
    .drawer{position:fixed;top:0;right:-400px;width:360px;max-width:90vw;height:100vh;background:#fff;border-left:1px solid var(--line);transition:right .2s;z-index:100;display:flex;flex-direction:column}
    .drawer.open{right:0}
    .drawer header{padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
    .drawer main{flex:1;overflow:auto;padding:12px}
    .drawer footer{padding:12px;border-top:1px solid var(--line);position:relative;background:#fff;display:grid;gap:8px}
    .cartline{border-bottom:1px dashed var(--line);padding:6px 0}

    /* Mode toggle */
    .mode-tabs{position:relative;display:inline-flex;align-items:center;gap:6px;background:#0f172a0d;border:1px solid #cbd5e1;padding:6px;border-radius:999px}
    .mode-tabs .thumb{position:absolute;top:6px;bottom:6px;width:50%;border-radius:999px;background:var(--brand);z-index:0;transition:transform .25s ease,background-color .25s ease}
    [data-mode="retail"] .mode-tabs .thumb{transform:translateX(0%);background:var(--brand)}
    [data-mode="wholesale"] .mode-tabs .thumb{transform:translateX(100%);background:#16a34a}
    .mode-tabs button{position:relative;z-index:1;border:0;background:transparent;padding:10px 18px;border-radius:999px;font-weight:800;font-size:15px;color:var(--ink);display:inline-flex;align-items:center;gap:8px;cursor:pointer}
    .mode-tabs button[aria-pressed="true"]{color:#fff}
    .mode-tabs button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(14,165,233,.45)}

    /* WhatsApp FAB */
    .fab{position:fixed;right:16px;bottom:max(16px, env(safe-area-inset-bottom));display:none;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:var(--wa);color:#fff;font-weight:800;text-decoration:none;box-shadow:0 10px 20px rgba(2,6,23,.18);z-index:120}
    .fab:hover{filter:brightness(.96)}
    .fab svg{width:20px;height:20px}
    .drawer.open ~ .fab{bottom:calc(16px + env(safe-area-inset-bottom))}

    /* Toast */
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 10px 20px rgba(2,6,23,.18);display:none;z-index:200}
    .toast.show{display:block;animation:fade .2s ease}
    @keyframes fade{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

    @media (max-width:960px){ .hero{padding:16px} .grid{padding:12px;gap:12px} }
    @media (max-width:640px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (max-width:380px){ .grid{grid-template-columns:1fr} }
    @media (max-width:480px){ .button{width:100%} .nav-actions{gap:8px} .dot{width:8px;height:8px} }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
  </style>
</head>
<body data-mode="retail">
  <header>
    <div class="nav">
      <div class="brand"><div class="logo" aria-hidden="true">F</div><span>Flair Car Accessories</span></div>
      <div class="nav-actions">
        <a href="#catalog" class="button primary">Browse Products</a>
        <button id="wishBtn" class="iconbtn" title="Wishlist" aria-label="Wishlist">❤️</button>
        <button id="cartBtn" class="button" type="button" aria-haspopup="dialog" aria-controls="drawer">
          Cart <span id="cartCount" style="background:var(--rose);color:#fff;border-radius:50%;padding:2px 6px;font-size:12px;display:none">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Free delivery progress -->
  <div class="bar">
    <div class="wrap">
      <div class="muted" id="freeText"></div>
      <div class="progress" aria-hidden="true"><span id="freeProgress"></span></div>
    </div>
  </div>

  <section class="hero">
    <div>
      <h1>Quality Car Accessories</h1>
      <p>Quick delivery in Kampala &amp; beyond.</p>
      <a href="#catalog" class="button primary">Shop Now</a>
    </div>
    <img src="https://i.postimg.cc/FzHzvCch/liz-car-Assessories.png" alt="Showcase of popular car accessories" loading="eager" width="1200" height="700" referrerpolicy="no-referrer">
  </section>

  <section id="catalog" aria-labelledby="catalog-title">
    <div class="controls">
      <div style="display:flex;align-items:center;gap:10px">
        <strong id="catalog-title">Catalog</strong>
        <div class="mode-tabs" id="modeTabs" aria-label="Buying mode" role="group">
          <span class="thumb" aria-hidden="true"></span>
          <button type="button" data-mode="retail" aria-pressed="true" title="Buy single units at retail price">Retail</button>
          <button type="button" data-mode="wholesale" aria-pressed="false" title="Buy in bulk at wholesale price">Wholesale</button>
        </div>
      </div>

      <div class="search">
        <input id="q" type="search" placeholder="Search products..." aria-label="Search products">
        <select id="sort" aria-label="Sort">
          <option value="relevance">Sort: Relevance</option>
          <option value="priceAsc">Price: Low → High</option>
          <option value="priceDesc">Price: High → Low</option>
          <option value="nameAsc">Name: A → Z</option>
        </select>
      </div>
    </div>

    <!-- Category chips auto-populate -->
    <div class="controls" style="padding-top:0">
      <div class="chips" id="chips" role="toolbar" aria-label="Filter by category"></div>
    </div>

    <div class="grid" id="grid" role="list"></div>
  </section>

  <footer>
    <p>© <span id="year"></span> Flair Car Accessories.</p>
  </footer>

  <!-- Cart Drawer -->
  <aside id="drawer" class="drawer" aria-label="Cart drawer" role="dialog" aria-modal="true" aria-hidden="true">
    <header>
      <strong>Your Cart</strong>
      <div style="display:flex;gap:8px">
        <button id="clearCart" class="button" type="button" title="Clear cart">Clear</button>
        <button id="closeDrawer" class="button" type="button" aria-label="Close cart">Close</button>
      </div>
    </header>
    <main id="cartLines"></main>
    <footer>
      <div id="grandTotal">Total: UGX 0</div>
      <div class="muted">Mode: <span id="cartMode">Retail</span></div>
      <label class="muted">Your name (optional):
        <input id="buyerName" type="text" placeholder="e.g., Brian" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px">
      </label>
      <a id="checkoutFab" class="button primary" href="#" target="_blank" rel="noopener noreferrer">Checkout on WhatsApp</a>
    </footer>
  </aside>

  <!-- Floating WhatsApp Checkout -->
  <a id="floatCheckout" class="fab" href="#" target="_blank" rel="noopener noreferrer" aria-label="ORDER NOW">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M19.11 17.56c-.26-.13-1.52-.75-1.76-.84s-.41-.13-.58.13-.66.84-.81 1.01-.3.19-.56.06a8.94 8.94 0 0 1-2.64-1.63 9.9 9.9 0 0 1-1.84-2.28c-.19-.32 0-.49.13-.62.13-.13.26-.32.39-.45.13-.13.19-.26.32-.45.13-.19.06-.36 0-.49-.06-.13-.58-1.39-.8-1.89-.21-.51-.43-.44-.58-.45h-.5a.96.96 0 0 0-.69.32c-.24.26-.9.88-.9 2.14s.92 2.49 1.05 2.66c.13.17 1.81 2.76 4.39 3.87.61.26 1.08.41 1.45.52.61.19 1.16.16 1.6.1.49-.07 1.52-.62 1.74-1.22.21-.58.21-1.08.15-1.22-.06-.13-.24-.2-.5-.33zM16 3C9.37 3 4 8.37 4 15c0 2.12.55 4.1 1.52 5.83L4 29l8.33-1.46A12.95 12.95 0 0 0 16 27c6.63 0 12-5.37 12-12S22.63 3 16 3zm0 22.33c-1.84 0-3.55-.54-4.98-1.46l-.36-.23-4.94.86.86-4.81-.24-.39A9.36 9.36 0 1 1 25.36 20a9.33 9.33 0 0 1-9.36 5.33z"/></svg>
    <span>Order</span>
  </a>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // ---------- Settings ----------
    const WHATSAPP_NUMBER = '256754760472';
    const IMG_BASE = 'images';                 // for relative image names in products.json
    const PRODUCTS_URL = 'products.json';      // served by GitHub Pages from your repo
    const FREE_DELIVERY_THRESHOLD = 250000;

    // ---------- Security helpers ----------
    const TRUSTED_IMG_HOSTS = new Set([location.hostname, 'i.postimg.cc', 'images.unsplash.com', 'raw.githubusercontent.com']);
    function safeURL(url) {
      try {
        const u = new URL(url, location.origin);
        if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
        if (u.origin === location.origin) return u.href;                 // local /images or products
        if (u.hostname && TRUSTED_IMG_HOSTS.has(u.hostname)) return u.href; // raw.githubusercontent.com, etc.
        return null;
      } catch { return null; }
    }
    function withBase(path){
      if(/^https?:\/\//i.test(path)) return path;       // absolute (e.g., raw.githubusercontent.com)
      const base = IMG_BASE.endsWith('/') ? IMG_BASE : IMG_BASE + '/';
      return base + String(path||'').split('/').map(encodeURIComponent).join('/');
    }

    // ---------- Data ----------
    /** products are loaded from products.json written by the Admin panel */
    let PRODUCTS = [];

    // ---------- Elements ----------
    const chips = document.getElementById('chips');
    const grid = document.getElementById('grid');
    const cartBtn = document.getElementById('cartBtn');
    const drawer = document.getElementById('drawer');
    const closeDrawer = document.getElementById('closeDrawer');
    const clearCartBtn = document.getElementById('clearCart');
    const cartLines = document.getElementById('cartLines');
    const grandTotal = document.getElementById('grandTotal');
    const checkoutFab = document.getElementById('checkoutFab');
    const floatCheckout = document.getElementById('floatCheckout');
    const cartCount = document.getElementById('cartCount');
    const cartMode = document.getElementById('cartMode');
    const modeTabs = document.getElementById('modeTabs');
    const toastEl = document.getElementById('toast');
    const searchInput = document.getElementById('q');
    const sortSel = document.getElementById('sort');
    const buyerName = document.getElementById('buyerName');
    const freeText = document.getElementById('freeText');
    const freeProgress = document.getElementById('freeProgress');

    // ---------- State (persisted) ----------
    let mode = localStorage.getItem('mode') || 'retail';
    /** @type {Map<string,{product:any,qty:number,unitPrice:number,mode:string}>} */
    let cart = new Map(JSON.parse(localStorage.getItem('cart') || '[]'));
    /** @type {Set<string>} */
    let wishlist = new Set(JSON.parse(localStorage.getItem('wishlist') || '[]'));
    let activeCat = 'all';

    // ---------- Utils ----------
    const fmtUGX = v => new Intl.NumberFormat('en-UG',{style:'currency',currency:'UGX',maximumFractionDigits:0}).format(v);
    const priceOf = (p) => mode==='retail' ? (Number(p.retailPrice)||0) : (Number(p.wholesalePrice)||0);
    const minQty  = (p) => mode==='retail' ? 1 : (Number(p.moq)||1);

    function showToast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 1500); }
    function persist(){ localStorage.setItem('cart', JSON.stringify([...cart])); localStorage.setItem('mode', mode); localStorage.setItem('wishlist', JSON.stringify([...wishlist])); }

    function sanitizeImgs(p){
      let arr = Array.isArray(p.imgs) && p.imgs.length ? p.imgs.slice(0,4) : (p.img ? [p.img] : []);
      while(arr.length < 4){ arr.push(arr[0] || 'https://images.unsplash.com/photo-1585421514284-efb74c2b9d6b?q=80&w=800&auto=format&fit=crop'); }
      return arr.map(u=>withBase(u)).map(u=>safeURL(u) || 'https://images.unsplash.com/photo-1585421514284-efb74c2b9d6b?q=80&w=800&auto=format&fit=crop');
    }

    function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

    // ---------- Load products.json ----------
    async function loadProducts(){
      // Cache-buster helps when GitHub Pages delays file refresh
      const url = PRODUCTS_URL + '?_=' + Date.now();
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) throw new Error('Failed to load products.json: ' + r.status);
      const data = await r.json();
      if(!Array.isArray(data)) throw new Error('products.json must be an array');
      // Normalize records
      PRODUCTS = data.map(x => ({
        id: x.id || String(Math.random()).slice(2),
        name: x.name || 'Unnamed',
        category: x.category || 'other',
        retailPrice: Number(x.retailPrice)||0,
        wholesalePrice: Number(x.wholesalePrice)||0,
        unit: x.unit || 'piece',
        moq: Number(x.moq)||1,
        desc: x.desc || '',
        imgs: Array.isArray(x.imgs) ? x.imgs : (x.img ? [x.img] : [])
      }));
    }

    // ---------- Mode toggle ----------
    function setMode(newMode){
      mode = newMode;
      document.body.setAttribute('data-mode', mode);
      modeTabs.querySelectorAll('button[data-mode]').forEach(btn=>{
        btn.setAttribute('aria-pressed', btn.dataset.mode===mode ? 'true':'false');
      });
      cartMode.textContent = mode==='retail' ? 'Retail' : 'Wholesale';
      persist();
      render();
      updateCartUI();
      showToast(`Mode: ${mode==='retail'?'Retail':'Wholesale'}`);
    }
    modeTabs.addEventListener('click',(e)=>{
      const b = e.target.closest('button[data-mode]');
      if(!b) return; setMode(b.dataset.mode);
    });

    // ---------- Filters ----------
    function buildCategoryChips(){
      const cats = ['all', ...new Set(PRODUCTS.map(p=>p.category||'other'))];
      chips.replaceChildren();
      cats.forEach(c=>{
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(c===activeCat));
        btn.textContent = c[0].toUpperCase()+c.slice(1);
        btn.addEventListener('click', ()=>{
          activeCat = c;
          [...chips.children].forEach(b=>b.setAttribute('aria-pressed','false'));
          btn.setAttribute('aria-pressed','true');
          render();
        });
        chips.appendChild(btn);
      });
    }

    function filteredAndSorted(){
      const q = (searchInput.value||'').trim().toLowerCase();
      let list = PRODUCTS.filter(p=>{
        const hitQ = !q || p.name.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q);
        const hitC = activeCat==='all' || (p.category||'other') === activeCat;
        return hitQ && hitC;
      });
      const cmp = {
        relevance:(a,b)=>0,
        priceAsc:(a,b)=>priceOf(a)-priceOf(b),
        priceDesc:(a,b)=>priceOf(b)-priceOf(a),
        nameAsc:(a,b)=>a.name.localeCompare(b.name)
      }[sortSel.value||'relevance'];
      if(cmp) list = list.slice().sort(cmp);
      return list;
    }

    // ---------- Rendering ----------
    function render(){
      grid.replaceChildren();
      const list = filteredAndSorted();

      if (!list.length){
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No products yet. Please check back soon.';
        grid.appendChild(empty);
        updateFloatingBtn();
        return;
      }

      list.forEach(p=>grid.appendChild(buildCard(p)));
      updateFloatingBtn();
    }

    function buildCard(p){
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role','listitem');

      // wishlist button
      const wishBtn = document.createElement('button');
      wishBtn.className = 'iconbtn wish';
      wishBtn.title = 'Save to wishlist';
      wishBtn.setAttribute('aria-pressed', String(wishlist.has(p.id)));
      wishBtn.textContent = wishlist.has(p.id) ? '💙' : '🤍';
      wishBtn.addEventListener('click', ()=>{
        if(wishlist.has(p.id)) wishlist.delete(p.id); else wishlist.add(p.id);
        wishBtn.textContent = wishlist.has(p.id) ? '💙' : '🤍';
        wishBtn.setAttribute('aria-pressed', String(wishlist.has(p.id)));
        persist();
        showToast(wishlist.has(p.id)?'Saved to wishlist':'Removed from wishlist');
      });
      card.appendChild(wishBtn);

      // Slider
      const slider = document.createElement('div');
      slider.className = 'slider';
      slider.dataset.pid = p.id;

      const prevBtn = document.createElement('button');
      prevBtn.className = 'navBtn navPrev';
      prevBtn.type = 'button';
      prevBtn.setAttribute('aria-label','Previous image');
      prevBtn.innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>';
      const nextBtn = document.createElement('button');
      nextBtn.className = 'navBtn navNext';
      nextBtn.type = 'button';
      nextBtn.setAttribute('aria-label','Next image');
      nextBtn.innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="m10 6 1.41 1.41L7.83 11H20v2H7.83l3.58 3.59L10 18l-6-6z"/></svg>';

      slider.appendChild(prevBtn);
      slider.appendChild(nextBtn);

      const imgs = sanitizeImgs(p);
      const dotsWrap = document.createElement('div');
      dotsWrap.className = 'dots';
      const slides = [];

      imgs.forEach((src, i)=>{
        const slide = document.createElement('div');
        slide.className = 'slide' + (i===0 ? ' active' : '');
        const img = document.createElement('img');
        img.loading = i===0 ? 'eager' : 'lazy';
        img.alt = p.name + ' image ' + (i+1);
        img.referrerPolicy = 'no-referrer';
        img.decoding = 'async';
        img.src = src;
        img.onerror = function(){ this.onerror=null; this.src='https://images.unsplash.com/photo-1585421514284-efb74c2b9d6b?q=80&w=800&auto=format&fit=crop'; };
        slide.appendChild(img);
        slider.appendChild(slide);
        slides.push(slide);

        const dot = document.createElement('span');
        dot.className = 'dot' + (i===0 ? ' active' : '');
        dot.dataset.i = String(i);
        dotsWrap.appendChild(dot);
      });
      slider.appendChild(dotsWrap);
      initSlider(slider);

      // Body
      const body = document.createElement('div');
      body.className = 'body';

      const h3 = document.createElement('h3');
      h3.textContent = p.name;
      if(mode==='wholesale'){
        const moq = document.createElement('span');
        moq.className = 'moq';
        moq.textContent = 'MOQ ' + minQty(p);
        h3.appendChild(document.createTextNode(' '));
        h3.appendChild(moq);
      }

      const desc = document.createElement('p');
      desc.className = 'muted';
      desc.textContent = p.desc || '';

      const price = document.createElement('div');
      price.className = 'price';
      price.textContent = `${fmtUGX(priceOf(p))} ${mode==='retail'?'(Retail)':'(Wholesale)'} `;
      if(mode==='wholesale'){
        const moq2 = document.createElement('span');
        moq2.className = 'moq';
        moq2.textContent = 'MOQ ' + minQty(p);
        price.appendChild(moq2);
      }

      const qtyWrap = document.createElement('div');
      qtyWrap.className = 'qty';
      const label = document.createElement('label');
      label.textContent = 'Qty: ';
      const input = document.createElement('input');
      input.type = 'number';
      input.id = 'qty-' + p.id;
      input.value = String(minQty(p));
      input.min = String(minQty(p));
      input.step = String(minQty(p));
      input.inputMode = 'numeric';
      input.pattern = '[0-9]*';
      input.addEventListener('change', ()=>{
        const min = minQty(p);
        let v = parseInt(input.value||min,10);
        if(!Number.isFinite(v) || v < min) v = min;
        if(v > 1000) v = 1000;
        const step = min;
        if(step>1){ v = Math.max(step, Math.round(v/step)*step); }
        input.value = String(v);
      });
      const unit = document.createElement('span');
      unit.className = 'muted';
      unit.textContent = ' / ' + (p.unit || 'piece');
      label.appendChild(input);
      qtyWrap.appendChild(label);
      qtyWrap.appendChild(unit);

      const addBtn = document.createElement('button');
      addBtn.className = 'button';
      addBtn.type = 'button';
      addBtn.textContent = 'Add to Cart';
      addBtn.addEventListener('click', ()=> addToCart(p.id));

      body.appendChild(h3);
      body.appendChild(desc);
      body.appendChild(price);
      body.appendChild(qtyWrap);
      body.appendChild(addBtn);

      card.appendChild(slider);
      card.appendChild(body);
      return card;
    }

    // ---------- Slider logic ----------
    const SLIDER_INTERVAL_MS = 3000;
    function initSlider(slider){
      let i = 0;
      const slides = [...slider.querySelectorAll('.slide')];
      const dots = [...slider.querySelectorAll('.dot')];
      const prevBtn = slider.querySelector('.navPrev');
      const nextBtn = slider.querySelector('.navNext');

      function show(n){
        i = (n + slides.length) % slides.length;
        slides.forEach((s,idx)=> s.classList.toggle('active', idx===i));
        dots.forEach((d,idx)=> d.classList.toggle('active', idx===i));
      }
      function next(){ show(i+1) }
      function prev(){ show(i-1) }

      let timer = setInterval(next, SLIDER_INTERVAL_MS);
      function pause(){ if(timer){ clearInterval(timer); timer=null; } }
      function resume(){ if(!timer) timer=setInterval(next, SLIDER_INTERVAL_MS); }

      slider.addEventListener('mouseenter', pause);
      slider.addEventListener('mouseleave', resume);
      document.addEventListener('visibilitychange', ()=>{ document.hidden ? pause() : resume(); });

      prevBtn.addEventListener('click', ()=>{ pause(); prev(); resume(); });
      nextBtn.addEventListener('click', ()=>{ pause(); next(); resume(); });

      slider.querySelector('.dots').addEventListener('click', (e)=>{
        const d = e.target.closest('.dot');
        if(!d) return;
        pause(); show(parseInt(d.dataset.i,10)); resume();
      });

      // Touch swipe
      let sx=0, sy=0, dx=0, dy=0, touching=false;
      slider.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; touching=true; pause(); }, {passive:true});
      slider.addEventListener('touchmove', (e)=>{ if(!touching) return; const t=e.touches[0]; dx=t.clientX-sx; dy=t.clientY-sy; }, {passive:true});
      slider.addEventListener('touchend', ()=>{ if(!touching) return; touching=false; if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ dx>0 ? prev() : next(); } dx=dy=0; resume(); });
    }

    // ---------- Cart ----------
    function openDrawer(){
      drawer.classList.add('open');
      drawer.setAttribute('aria-hidden','false');
      updateFloatingBtn();
    }
    function closeDrawerFn(){
      drawer.classList.remove('open');
      drawer.setAttribute('aria-hidden','true');
      updateFloatingBtn();
    }
    closeDrawer.addEventListener('click', closeDrawerFn);
    cartBtn.addEventListener('click', ()=>{ drawer.classList.toggle('open'); const open = drawer.classList.contains('open'); drawer.setAttribute('aria-hidden', open?'false':'true'); updateFloatingBtn(); });
    clearCartBtn.addEventListener('click', ()=>{ cart.clear(); persist(); updateCartUI(); showToast('Cart cleared'); });

    function addToCart(id){
      const product = PRODUCTS.find(x=>x.id===id);
      if(!product) return;
      const qtyInput = document.getElementById(`qty-${id}`);
      const min = minQty(product);
      let qty = parseInt(qtyInput?.value ?? min,10);
      if(!Number.isFinite(qty) || qty < min) qty = min;
      if(qty > 1000) qty = 1000;
      const step = min;
      if(step>1){ qty = Math.max(step, Math.round(qty/step)*step); qtyInput.value = String(qty); }

      const unitPrice = priceOf(product);
      const key = id+':'+mode;
      const existing = cart.get(key);
      cart.set(key,{product,qty:(existing?existing.qty:0)+qty,unitPrice,mode});
      persist();
      updateCartUI();
      openDrawer();
      showToast('Added to cart');
    }

    function removeLine(key){
      cart.delete(key);
      persist();
      updateCartUI();
      showToast('Removed from cart');
    }

    function updateCartUI(){
      cartLines.replaceChildren();
      let total=0; let count=0;

      cart.forEach(({product,qty,unitPrice,mode}, key)=>{
        const lineTotal = unitPrice*qty; total+=lineTotal; count+=qty;

        const wrap = document.createElement('div');
        wrap.className = 'cartline';

        const name = document.createElement('strong'); name.textContent = product.name;
        const br = document.createElement('br');
        const span = document.createElement('span'); span.className='muted';
        span.textContent = `${mode==='retail'?'Retail':'Wholesale'} • ${fmtUGX(unitPrice)} × ${qty} = `;
        const totalStrong = document.createElement('strong'); totalStrong.textContent = fmtUGX(lineTotal);

        const del = document.createElement('button'); del.className='button'; del.textContent='Remove'; del.type='button';
        del.style.marginTop='6px';
        del.addEventListener('click', ()=> removeLine(key));

        wrap.appendChild(name); wrap.appendChild(br); wrap.appendChild(span); wrap.appendChild(totalStrong); wrap.appendChild(document.createElement('br')); wrap.appendChild(del);
        cartLines.appendChild(wrap);
      });

      grandTotal.textContent = 'Total: '+fmtUGX(total);
      cartCount.style.display = count>0? 'inline-block':'none';
      cartCount.textContent = String(count);

      const waHref = cartToWhatsApp();
      checkoutFab.href = waHref;
      floatCheckout.href = waHref;
      updateFloatingBtn();
      updateFreeDelivery(total);
    }

    function cartToWhatsApp(){
      if(cart.size===0) return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('Hello Flair Car Accessories')}`;
      let lines=[]; let total=0;
      cart.forEach(({product,qty,unitPrice,mode})=>{
        total+=unitPrice*qty;
        lines.push(`• ${product.name} x${qty} @ ${fmtUGX(unitPrice)} (${mode})`);
      });
      const name = buyerName.value.trim();
      const header = name ? `Hello, I'm ${name}. Here is my order:` : `Hello Flair Car Accessories, here is my order:`;
      const msg = `${header}\n${lines.join('\n')}\nTotal: ${fmtUGX(total)}\nMode: ${mode}`;
      return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
    }

    function updateFloatingBtn(){
      const visible = cart.size>0 && drawer.classList.contains('open');
      floatCheckout.style.display = visible ? 'flex' : 'none';
    }

    function updateFreeDelivery(total){
      const left = Math.max(0, FREE_DELIVERY_THRESHOLD - total);
      freeText.textContent = left>0
        ? `Add ${fmtUGX(left)} more for FREE delivery in Kampala`
        : `🎉 You’ve unlocked FREE delivery in Kampala`;
      const pct = Math.min(100, Math.round((total/FREE_DELIVERY_THRESHOLD)*100));
      freeProgress.style.width = pct + '%';
      freeProgress.style.background = left>0 ? 'linear-gradient(90deg,#16a34a,#0ea5e9)' : '#16a34a';
    }

    // ---------- Init ----------
    document.getElementById('year').textContent = new Date().getFullYear();

    searchInput.addEventListener('input', debounce(render, 120));
    sortSel.addEventListener('change', render);
    buyerName.addEventListener('input', ()=>{ const href = cartToWhatsApp(); checkoutFab.href = href; floatCheckout.href = href; });

    (async function init(){
      try{
        await loadProducts();         // get products.json written by Admin page
      }catch(e){
        console.error(e);
        PRODUCTS = [];                // enforce: no hardcoded products
      }
      buildCategoryChips();
      setMode(mode);                  // also renders
      updateCartUI();
    })();
  </script>
</body>
</html>
